name: Sync GabriPlay YouTube uploads

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Fetch public YouTube channel feed
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          channel_id = "UCGjJD7KS8P8BfhEHL0qYdNQ"
          url = f"https://www.youtube.com/feeds/videos.xml?channel_id={channel_id}"
          request = urllib.request.Request(url, headers={"User-Agent": "GabriPlayFeed/1.0"})
          with urllib.request.urlopen(request, timeout=30) as response:
              root = ET.fromstring(response.read())

          ns = {"atom": "http://www.w3.org/2005/Atom", "yt": "http://www.youtube.com/xml/schemas/2015"}
          videos = []
          for entry in root.findall("atom:entry", ns):
              video_id = entry.findtext("yt:videoId", namespaces=ns)
              title = entry.findtext("atom:title", default="", namespaces=ns)
              published = entry.findtext("atom:published", default="", namespaces=ns)
              if video_id:
                  videos.append({"id": video_id, "title": title, "published": published})
          Path("latest-videos.json").write_text(json.dumps(videos[:15], ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")
          print(f"Saved {len(videos[:15])} public videos")
          PY
      - name: Commit updated feed
        run: |
          if git diff --quiet -- latest-videos.json; then
            echo "No new uploads."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-videos.json
          git commit -m "Sync latest GabriPlay YouTube videos"
          git push
