
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  "use strict";

  const SUPABASE_URL = "https://gzqebfwknfnwnobwypve.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_NjEt_shVbSEbvALrsFt4c_Q_GOGgPBKz";

  const $ = id => document.getElementById(id);

  const modal = $("accountModal");
  const accountForm = $("accountForm");
  const accountStatus = $("accountStatus");
  const suggestionStatus = $("suggestionStatus");
  const suggestionList = $("suggestionList");
  const suggestionSubmit = $("suggestionSubmit");

  let currentUser = null;
  let isAdmin = false;
  let authMode = "login";
  let refreshQueue = Promise.resolve();
  let loadVersion = 0;

  function setStatus(element, message, error = false) {
    if (!element) return;
    element.textContent = message;
    element.style.color = error ? "#ff9b9b" : "";
  }

  function toast(message) {
    if (typeof showToast === "function") showToast(message);
  }

  function emptySuggestions(message) {
    if (!suggestionList) return;
    const element = document.createElement("div");
    element.className = "gp-empty";
    element.textContent = message;
    suggestionList.replaceChildren(element);
  }

  if (!window.supabase?.createClient) {
    emptySuggestions("La comunidad no está disponible ahora mismo.");
    setStatus(suggestionStatus, "No se pudo conectar con el servicio.", true);
    if (suggestionSubmit) suggestionSubmit.disabled = true;
    return;
  }

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  function openAccount() {
    modal.classList.add("open");
    document.body.style.overflow = "hidden";

    if (currentUser) showSignedInPanel();
    else setAuthMode("login");
  }

  function closeAccount() {
    modal.classList.remove("open");
    document.body.style.overflow = "";
  }

  function setAuthMode(mode) {
    authMode = mode;

    document.querySelectorAll("[data-auth-mode]").forEach(button => {
      button.classList.toggle("active", button.dataset.authMode === mode);
    });

    $("registerFields").hidden = mode !== "register";

    $("accountPassword").setAttribute(
      "autocomplete",
      mode === "register" ? "new-password" : "current-password"
    );

    $("accountSubmit").textContent =
      mode === "register" ? "CREAR CUENTA" : "ENTRAR";

    $("accountModalTitle").textContent =
      mode === "register" ? "ÚNETE A LA COMUNIDAD." : "TU CUENTA.";

    setStatus(accountStatus, "");
  }

  function showSignedInPanel() {
    accountForm.hidden = true;
    $("signedInPanel").hidden = false;

    const metadata = currentUser?.user_metadata || {};
    const username =
      metadata.display_name ||
      metadata.username ||
      currentUser?.email ||
      "Usuario";

    $("signedInText").textContent =
      "Has iniciado sesión como " + username + ".";
  }

  function showAuthForm() {
    accountForm.hidden = false;
    $("signedInPanel").hidden = true;
  }

  async function checkAdmin() {
    isAdmin = false;

    if (!currentUser) return;

    try {
      const { data, error } = await db
        .from("gabriplay_admins")
        .select("user_id")
        .eq("user_id", currentUser.id)
        .maybeSingle();

      if (!error && data) isAdmin = true;
    } catch {
      isAdmin = false;
    }
  }

  async function loadSuggestions() {
    const version = ++loadVersion;

    if (!suggestionList) return;

    emptySuggestions("Cargando sugerencias…");

    try {
      const { data, error } = await db
        .from("suggestions")
        .select("id,user_id,title,description,status,created_at")
        .order("created_at", { ascending: false })
        .limit(50);

      if (version !== loadVersion) return;

      if (error) {
        emptySuggestions(
          "No se han podido cargar las sugerencias. Inténtalo de nuevo más tarde."
        );
        return;
      }

      const suggestions = (data || []).filter(item =>
        isAdmin ||
        item.status === "approved" ||
        item.status === "completed"
      );

      if (!suggestions.length) {
        emptySuggestions(
          "Todavía no hay sugerencias aprobadas. ¡Puedes proponer la primera!"
        );
        return;
      }

      let votes = [];
      let voteError = false;

      try {
        const result = await db
          .from("suggestion_votes")
          .select("suggestion_id,user_id");

        if (result.error) voteError = true;
        else votes = result.data || [];
      } catch {
        voteError = true;
      }

      if (version !== loadVersion) return;

      const voteCounts = {};
      const myVotes = new Set();

      votes.forEach(vote => {
        voteCounts[vote.suggestion_id] =
          (voteCounts[vote.suggestion_id] || 0) + 1;

        if (currentUser && vote.user_id === currentUser.id) {
          myVotes.add(vote.suggestion_id);
        }
      });

      suggestionList.replaceChildren();

      suggestions.forEach(item => {
        const card = document.createElement("article");
        card.className = "gp-suggestion";

        const top = document.createElement("div");
        top.className = "gp-suggestion-top";

        const tag = document.createElement("span");
        tag.className = "gp-tag";

        if (item.status === "pending") tag.classList.add("pending");
        if (item.status === "rejected") tag.classList.add("rejected");

        const statusNames = {
          pending: "PENDIENTE",
          approved: "APROBADA",
          rejected: "NO APROBADA",
          completed: "COMPLETADA"
        };

        tag.textContent = statusNames[item.status] || "SUGERENCIA";

        const title = document.createElement("h4");
        title.textContent = item.title || "Sugerencia";

        top.appendChild(tag);
        card.appendChild(top);
        card.appendChild(title);

        const description = document.createElement("p");
        description.textContent = item.description || "";
        card.appendChild(description);

        const actions = document.createElement("div");
        actions.className = "gp-card-actions";

        if (item.status === "approved") {
          const vote = document.createElement("button");
          vote.type = "button";

          vote.textContent =
            (myVotes.has(item.id) ? "♥ VOTADO" : "♡ VOTAR") +
            " · " +
            (voteCounts[item.id] || 0);

          if (!currentUser) {
            vote.addEventListener("click", () => {
              openAccount();
              setStatus(accountStatus, "Inicia sesión para votar.");
            });
          } else {
            vote.addEventListener("click", () => toggleVote(item.id));
          }

          actions.appendChild(vote);
        }

        if (isAdmin) {
          [
            ["approved", "APROBAR"],
            ["rejected", "RECHAZAR"],
            ["completed", "COMPLETADA"]
          ].forEach(([value, label]) => {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = label;

            button.addEventListener("click", () =>
              moderateSuggestion(item.id, value)
            );

            actions.appendChild(button);
          });
        }

        if (actions.childElementCount) {
          card.appendChild(actions);
        }

        suggestionList.appendChild(card);
      });

      if (voteError) {
        setStatus(
          suggestionStatus,
          "Las sugerencias están disponibles, pero no se han podido cargar los votos."
        );
      }

    } catch {
      if (version === loadVersion) {
        emptySuggestions("Error de conexión. Vuelve a intentarlo.");
      }
    }
  }

  async function toggleVote(id) {
    if (!currentUser) {
      openAccount();
      return;
    }

    try {
      const { data: existing, error: findError } = await db
        .from("suggestion_votes")
        .select("suggestion_id")
        .eq("suggestion_id", id)
        .eq("user_id", currentUser.id)
        .maybeSingle();

      if (findError) {
        toast("No se ha podido comprobar tu voto.");
        return;
      }

      const result = existing
        ? await db
            .from("suggestion_votes")
            .delete()
            .eq("suggestion_id", id)
            .eq("user_id", currentUser.id)
        : await db
            .from("suggestion_votes")
            .insert({
              suggestion_id: id,
              user_id: currentUser.id
            });

      if (result.error) {
        toast("No se ha podido guardar el voto.");
        return;
      }

      toast(existing ? "Voto retirado." : "¡Voto guardado!");
      await loadSuggestions();

    } catch {
      toast("Error al conectar con la comunidad.");
    }
  }

  async function moderateSuggestion(id, status) {
    if (!isAdmin) return;

    try {
      const { error } = await db
        .from("suggestions")
        .update({ status })
        .eq("id", id);

      if (error) {
        toast("No se pudo actualizar la sugerencia.");
        return;
      }

      toast("Sugerencia actualizada.");
      await loadSuggestions();

    } catch {
      toast("Error al actualizar la sugerencia.");
    }
  }

  async function refreshSession(session) {
    refreshQueue = refreshQueue.then(async () => {
      currentUser = session?.user || null;

      await checkAdmin();

      const metadata = currentUser?.user_metadata || {};
      const username =
        metadata.display_name ||
        metadata.username ||
        "Usuario";

      $("accountButton").textContent =
        currentUser ? "MI PERFIL" : "MI CUENTA";

      $("communityAccountAction").textContent =
        currentUser ? "MI CUENTA" : "INICIAR SESIÓN";

      $("communityUser").textContent = currentUser
        ? "Sesión iniciada · " + username +
          (isAdmin ? " · ADMINISTRADOR" : "")
        : "Estás explorando como visitante.";

      suggestionSubmit.disabled = !currentUser;

      setStatus(
        suggestionStatus,
        currentUser
          ? "Tu propuesta quedará pendiente de revisión."
          : "Inicia sesión para enviar una propuesta."
      );

      if (modal.classList.contains("open")) {
        if (currentUser) showSignedInPanel();
        else showAuthForm();
      }

      await loadSuggestions();
    }).catch(() => {
      emptySuggestions("No se ha podido actualizar la comunidad.");
    });

    return refreshQueue;
  }

  // BOTONES Y MODAL

  $("accountButton").addEventListener("click", openAccount);
  $("communityAccountAction").addEventListener("click", openAccount);
  $("closeAccountModal").addEventListener("click", closeAccount);

  modal.addEventListener("click", event => {
    if (event.target === modal) closeAccount();
  });

  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && modal.classList.contains("open")) {
      closeAccount();
    }
  });

  document.querySelectorAll("[data-auth-mode]").forEach(button => {
    button.addEventListener("click", () => {
      setAuthMode(button.dataset.authMode);
    });
  });

  // REGISTRO E INICIO DE SESIÓN

  accountForm.addEventListener("submit", async event => {
    event.preventDefault();

    const submit = $("accountSubmit");
    submit.disabled = true;

    try {
      const email = $("accountEmail").value.trim();
      const password = $("accountPassword").value;

      if (authMode === "register") {
        const username = $("accountUsername").value
          .trim()
          .toLowerCase();

        const displayName =
          $("accountDisplayName").value.trim() || username;

        if (!/^[a-z0-9_]{3,24}$/.test(username)) {
          setStatus(
            accountStatus,
            "El usuario debe tener entre 3 y 24 caracteres: letras, números o guion bajo.",
            true
          );
          return;
        }

        if (password.length < 8) {
          setStatus(
            accountStatus,
            "La contraseña debe tener al menos 8 caracteres.",
            true
          );
          return;
        }

        const { data, error } = await db.auth.signUp({
          email,
          password,
          options: {
            data: {
              username,
              display_name: displayName
            },
            emailRedirectTo:
              "https://gabriel10mp.github.io/GabriPlay-Web/"
          }
        });

        if (error) throw error;

        if (data.session) {
          setStatus(accountStatus, "¡Cuenta creada correctamente!");
          await refreshSession(data.session);
        } else {
          setStatus(
            accountStatus,
            "Cuenta creada. Revisa tu correo para confirmar el registro."
          );
        }

      } else {
        const { data, error } = await db.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;

        setStatus(accountStatus, "Sesión iniciada correctamente.");
        await refreshSession(data.session);
      }

    } catch (error) {
      setStatus(
        accountStatus,
        error.message || "Ha ocurrido un error al acceder.",
        true
      );
    } finally {
      submit.disabled = false;
    }
  });

  // CERRAR SESIÓN

  $("signOutButton").addEventListener("click", async () => {
    const button = $("signOutButton");
    button.disabled = true;

    try {
      const { error } = await db.auth.signOut();
      if (error) throw error;

      setAuthMode("login");
      showAuthForm();
      setStatus(accountStatus, "Has cerrado sesión.");

      await refreshSession(null);

    } catch (error) {
      setStatus(
        accountStatus,
        error.message || "No se ha podido cerrar sesión.",
        true
      );
    } finally {
      button.disabled = false;
    }
  });

  // ENVIAR SUGERENCIAS

  $("suggestionForm").addEventListener("submit", async event => {
    event.preventDefault();

    if (!currentUser) {
      openAccount();
      setStatus(accountStatus, "Inicia sesión para enviar una sugerencia.");
      return;
    }

    const title = $("suggestionTitle").value.trim();
    const description = $("suggestionDescription").value.trim();

    if (!title || !description) return;

    suggestionSubmit.disabled = true;

    try {
      const { error } = await db
        .from("suggestions")
        .insert({
          user_id: currentUser.id,
          title,
          description,
          status: "pending"
        });

      if (error) throw error;

      $("suggestionForm").reset();

      setStatus(
        suggestionStatus,
        "¡Idea enviada! Quedará pendiente de revisión."
      );

      toast("Sugerencia enviada.");
      await loadSuggestions();

    } catch (error) {
      setStatus(
        suggestionStatus,
        error.message || "No se ha podido enviar la sugerencia.",
        true
      );
    } finally {
      suggestionSubmit.disabled = !currentUser;
    }
  });

  // SESIÓN INICIAL Y CAMBIOS DE SESIÓN

  db.auth.onAuthStateChange((_event, session) => {
    window.setTimeout(() => refreshSession(session), 0);
  });

  db.auth.getSession()
    .then(({ data, error }) => {
      if (error) throw error;
      return refreshSession(data.session);
    })
    .catch(() => {
      emptySuggestions(
        "No se ha podido comprobar tu sesión. Puedes seguir navegando por GabriPlay."
      );
      setStatus(
        suggestionStatus,
        "No se ha podido conectar con tu cuenta.",
        true
      );
    });

})();
</script>
