/* GabriPlay — Japanese crimson profile theme */
:root{--bg:#080809;--surface:#111114;--line:#392329;--muted:#aaa4a1;--red:#c52b40;--red2:#e34b58}
body{background:radial-gradient(ellipse at 80% 0%,#6f17201c,transparent 36%),#080809;color:#f4f1ed}

a.back,.back{border-color:#74313a;color:#e8c6c8;background:#100c0e}
.back:hover{background:#b51f3220}

.banner{height:230px;background:radial-gradient(circle at 78% 28%,#c52b40 0 12%,#741421 12.5% 13%,transparent 13.5%),linear-gradient(90deg,#090809aa,#09080944),linear-gradient(135deg,#1a0d11,#090809 65%);position:relative;z-index:0;isolation:isolate}
.banner:after{z-index:1;pointer-events:none}
.body{position:relative;z-index:2}
.avatar{position:relative;z-index:3;isolation:isolate;flex-shrink:0}
.avatar img{display:block;object-fit:cover;object-position:center;width:100%;height:100%}

.banner:after{content:"";position:absolute;inset:auto 8% 0 auto;width:38%;height:72%;opacity:.35;background:linear-gradient(#090809,#090809) 0 15%/100% 7px no-repeat,linear-gradient(#090809,#090809) 0 30%/100% 7px no-repeat,linear-gradient(#090809,#090809) 15% 0/9px 100% no-repeat,linear-gradient(#090809,#090809) 85% 0/9px 100% no-repeat}
.avatar{border-color:#111114}.avatar.frame_crimson{border:5px solid #c52b40;box-shadow:0 0 0 4px #c52b4040,0 0 22px #c52b4060}.avatar.frame_onyx{border:5px solid #55545e;box-shadow:inset 0 0 0 2px #17171c,0 0 0 4px #aaa9b640,0 0 18px #aaa9b625}

.links a,.preview-links span{border-color:#71303a}

<script>
(() => {
  const versionUrl = new URL("version.json", location.href);
  let currentVersion = null;
  let updatePending = false;
  let checking = false;
  const hasActiveWork = () => {
    const active = document.activeElement;
    if (active && active.matches("input,textarea,select,[contenteditable=true]")) return true;
    return !!document.querySelector(".modal.open, .lightbox.open, dialog[open]");
  };
  const reloadWhenSafe = () => {
    if (updatePending && !hasActiveWork() && document.visibilityState === "visible") {
      location.reload();
    }
  };
  const checkForUpdate = async () => {
    if (checking || document.visibilityState !== "visible") return;
    checking = true;
    try {
      const response = await fetch(versionUrl.href + "?check=" + Date.now(), { cache: "no-store" });
      if (!response.ok) return;
      const data = await response.json();
      if (!data.version) return;
      if (currentVersion === null) {
        currentVersion = data.version;
        return;
      }
      if (data.version !== currentVersion) {
        updatePending = true;
        reloadWhenSafe();
      }
    } catch (_) {
      // Si la red o GitHub Pages falla temporalmente, se reintentará.
    } finally {
      checking = false;
    }
  };
  checkForUpdate();
  window.setInterval(checkForUpdate, 30000);
  window.addEventListener("focus", () => { checkForUpdate(); reloadWhenSafe(); });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      checkForUpdate();
      reloadWhenSafe();
    }
  });
  document.addEventListener("focusout", () => window.setTimeout(reloadWhenSafe, 250));
})();
</script>
