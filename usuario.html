<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08080c"><title>Perfil — GabriPlay</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080c;--surface:#111118;--line:#292933;--muted:#a2a2ad;--rainbow:linear-gradient(90deg,#ff4141,#ff963b,#ffe34b,#5cda78,#45c3ff,#a879ff,#f15dbb)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f6f6f8;font-family:Inter,Arial,sans-serif;min-height:100vh}.rainbow{height:4px;background:var(--rainbow)}.wrap{width:min(900px,calc(100% - 32px));margin:auto}.top{height:72px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff15}.logo{font-weight:900;display:flex;gap:10px;align-items:center}.mark{width:39px;height:39px;display:grid;place-items:center;background:#15151c;border:1px solid #ffffff35;border-radius:9px;font:900 23px "Barlow Condensed";position:relative}.mark:after{content:"";position:absolute;bottom:0;left:0;right:0;height:4px;background:var(--rainbow)}.back{font-size:10px;font-weight:900;color:#ccc;border:1px solid #ffffff2a;border-radius:7px;padding:11px 14px;text-decoration:none}.card{margin:45px auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}.banner{height:230px;background:radial-gradient(ellipse at 70% 20%,#a879ff55,transparent 50%),linear-gradient(130deg,#171720,#252034);background-position:center;background-size:cover}.body{padding:0 30px 30px}.avatar{width:112px;height:112px;border:5px solid var(--surface);border-radius:50%;margin-top:-56px;background:#25252e;display:grid;place-items:center;overflow:hidden;font:900 42px "Barlow Condensed"}.avatar img{width:100%;height:100%;object-fit:cover}.name{font-size:30px;font-weight:900;margin-top:15px;overflow-wrap:anywhere}.handle{color:#c0a8ff;font-size:12px;margin-top:5px}.bio{white-space:pre-wrap;color:#c4c4ce;font-size:13px;line-height:1.8;margin-top:20px;overflow-wrap:anywhere}.links{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}.links a{padding:10px 13px;border:1px solid #ffffff2b;border-radius:7px;color:white;text-decoration:none;font-size:10px;font-weight:900}.links a:hover{background:#ffffff12}.joined{color:#777;font-size:10px;margin-top:24px}.status{text-align:center;color:var(--muted);padding:50px 15px;font-size:13px}.footer{border-top:1px solid var(--line);padding:22px 0;color:#777;font-size:9px;display:flex;justify-content:space-between}.hidden{display:none}@media(max-width:600px){.banner{height:165px}.body{padding:0 20px 24px}.name{font-size:25px}}
</style></head><body><div class="rainbow"></div><header class="top wrap"><a class="logo" href="index.html" style="color:inherit;text-decoration:none"><span class="mark">GP</span>GabriPlay</a><a class="back" href="index.html#comunidad">← COMUNIDAD</a></header><main class="wrap"><div class="card hidden" id="profile"><div class="banner" id="banner"></div><div class="body"><div class="avatar" id="avatar">G</div><div class="name" id="name"></div><div class="handle" id="handle"></div><p class="bio" id="bio"></p><div class="links" id="links"></div><div class="joined" id="joined"></div></div></div><div class="status" id="status">Cargando perfil...</div></main><footer class="footer wrap"><span>© <span id="year"></span> GABRIPLAY</span><span>PLAY BEYOND.</span></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(async()=>{const SUPABASE_URL="https://gzqebfwknfnwnobwypve.supabase.co";const KEY="sb_publishable_NjEt_shVbSEbvALrsFt4cQ_GOGgPBKz";const db=window.supabase.createClient(SUPABASE_URL,KEY);const $=id=>document.getElementById(id);$("year").textContent=new Date().getFullYear();function safeUrl(value){try{const u=new URL(value);return u.protocol==="https:"?u.href:""}catch{return ""}}const username=(new URLSearchParams(location.search).get("u")||"").trim().toLowerCase();if(!/^[a-z0-9_]{3,24}$/.test(username)){$("status").textContent="El enlace del perfil no es válido.";return}const {data,error}=await db.from("profiles").select("username,display_name,bio,avatar_url,banner_url,website_url,youtube_url,twitch_url,created_at").eq("username",username).maybeSingle();if(error)throw error;if(!data){$("status").textContent="No hemos encontrado este perfil.";return}const p=data;$("name").textContent=p.display_name||p.username;$("handle").textContent="@"+p.username;$("bio").textContent=p.bio||"Este miembro todavía no ha añadido una biografía.";const avatar=safeUrl(p.avatar_url||"");if(avatar){const img=document.createElement("img");img.src=avatar;img.alt="Foto de perfil";img.referrerPolicy="no-referrer";img.onerror=()=>{$("avatar").textContent=(p.display_name||p.username)[0].toUpperCase()};$("avatar").replaceChildren(img)}else $("avatar").textContent=(p.display_name||p.username)[0].toUpperCase();const banner=safeUrl(p.banner_url||"");if(banner)$("banner").style.backgroundImage="url("+JSON.stringify(banner)+")";const items=[["WEB",p.website_url],["YOUTUBE",p.youtube_url],["TWITCH",p.twitch_url]];items.forEach(([label,value])=>{const href=safeUrl(value||"");if(!href)return;const a=document.createElement("a");a.href=href;a.target="_blank";a.rel="noopener noreferrer";a.textContent=label+" ↗";$("links").appendChild(a)});if(p.created_at){const d=new Date(p.created_at);$("joined").textContent="MIEMBRO DESDE "+d.toLocaleDateString("es-ES",{month:"long",year:"numeric"}).toUpperCase()}$("profile").classList.remove("hidden");$("status").classList.add("hidden");document.title=p.display_name+" (@"+p.username+") — GabriPlay"})().catch(err=>{document.getElementById("status").textContent=err.message||"No se pudo cargar el perfil."});
</script></body></html>
